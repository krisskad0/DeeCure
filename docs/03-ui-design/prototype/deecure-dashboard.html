<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>DeeCure Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400..700&family=Ubuntu+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height admin dashboard. Top bar, collapsible sidebar tree (page > sub-pages), sticky page header with tabs, 12-column panel grid. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f7f8fa; --hover:#eef1f5; --track:#e8ebf0;
  --line:#e2e5ea; --line-2:#cfd4dc; --ink:#111620; --ink-2:#465061; --muted:#768092;
  --accent:#2563c9; --accent-ink:#ffffff; --accent-soft:#e8f0fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --good-ink:#14742b; --good-soft:#e4f4e6;
  --warn:#fab219; --warn-ink:#8a5900; --warn-soft:#fdf2da;
  --crit:#d03b3b; --crit-ink:#b42525; --crit-soft:#fbe7e7;
  --info-ink:#2457ad; --info-soft:#e8f0fc; --neutral-soft:#eceef2;
  --grid:#eceef2; --axis:#c9ced6;
  --h1:#e3edfb; --h2:#b7d3f6; --h3:#6da7ec; --h4:#2a78d6; --h5:#184f95;
  --scrim:rgba(17,22,32,.42); --shadow:0 12px 32px -8px rgba(17,22,32,.25), 0 2px 6px rgba(17,22,32,.08);
  --font:"Ubuntu Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Ubuntu Sans Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d11; --panel:#14171c; --panel-2:#191d23; --hover:#1f242b; --track:#262c35;
    --line:#252a32; --line-2:#343b46; --ink:#e8ebef; --ink-2:#aab2bf; --muted:#7d8695;
    --accent:#5f9df0; --accent-ink:#0b0d11; --accent-soft:#16243a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good:#0ca30c; --good-ink:#5fcf6a; --good-soft:#12261a;
    --warn:#fab219; --warn-ink:#f6c457; --warn-soft:#2c2411;
    --crit:#d03b3b; --crit-ink:#f08585; --crit-soft:#331919;
    --info-ink:#8fb8f6; --info-soft:#16243a; --neutral-soft:#222831;
    --grid:#1f242b; --axis:#384049;
    --h1:#17202d; --h2:#1c3a63; --h3:#255da0; --h4:#3987e5; --h5:#86b6ef;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px -8px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d11; --panel:#14171c; --panel-2:#191d23; --hover:#1f242b; --track:#262c35;
  --line:#252a32; --line-2:#343b46; --ink:#e8ebef; --ink-2:#aab2bf; --muted:#7d8695;
  --accent:#5f9df0; --accent-ink:#0b0d11; --accent-soft:#16243a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good:#0ca30c; --good-ink:#5fcf6a; --good-soft:#12261a;
  --warn:#fab219; --warn-ink:#f6c457; --warn-soft:#2c2411;
  --crit:#d03b3b; --crit-ink:#f08585; --crit-soft:#331919;
  --info-ink:#8fb8f6; --info-soft:#16243a; --neutral-soft:#222831;
  --grid:#1f242b; --axis:#384049;
  --h1:#17202d; --h2:#1c3a63; --h3:#255da0; --h4:#3987e5; --h5:#86b6ef;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px -8px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* app shell */
.app{height:100%;display:grid;grid-template-columns:var(--sbw,240px) minmax(0,1fr);grid-template-rows:52px minmax(0,1fr)}
.app.rail{--sbw:60px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:12}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo .ic{width:18px;height:18px;stroke-width:2.2}
.host{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-left:10px;white-space:nowrap}
.host .d{width:8px;height:8px;border-radius:50%;background:var(--good)}
.host small{color:var(--muted)}
.proto{font-size:11.5px;color:var(--warn-ink);background:var(--warn-soft);padding:2px 8px;border-radius:4px;white-space:nowrap}
.search-trigger{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--muted);text-align:left;min-width:0}
.search-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2);background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--panel-2);flex:none}
.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.tb-r{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.ibtn{position:relative;width:32px;height:32px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn .cnt{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:12.5px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.menu-btn{display:none}

.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;padding-block:8px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;min-height:0}
.nav-g{margin-top:12px}
.nav-g:first-child{margin-top:4px}
.nav-gl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 5px;white-space:nowrap}
.ni{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px 0 10px;border:0;background:none;border-radius:6px;color:var(--ink-2);font-weight:500;text-align:left;white-space:nowrap}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ni .ic{width:17px;height:17px}
.ni .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ni .chev{width:14px;height:14px;color:var(--muted);transition:transform .15s}
.ni.open .chev{transform:rotate(90deg)}
.ndot{width:7px;height:7px;border-radius:50%;flex:none}
.ndot.warn{background:var(--warn)}.ndot.crit{background:var(--crit)}.ndot.info{background:var(--s1)}
.ncnt{font-size:11px;font-weight:700;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--crit-soft);color:var(--crit-ink);line-height:18px;text-align:center}
.sub{margin:1px 0 4px 18px;padding-left:10px;border-left:1px solid var(--line)}
.si{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:5px;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si:hover{color:var(--ink);background:var(--hover)}
.si.on{color:var(--accent);font-weight:600}
.sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.app.rail .lab,.app.rail .nav-gl,.app.rail .sub,.app.rail .chev,.app.rail .ncnt{display:none}
.app.rail .ni{justify-content:center;padding:0;position:relative}
.app.rail .ndot{position:absolute;top:6px;right:8px}
.app.rail .nav-g{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.app.rail .nav-g:first-child{border-top:0;padding-top:0}

/* main */
.main{overflow:auto;min-width:0;min-height:0;padding-right:max(20px,env(safe-area-inset-right,0px))}
.phead{position:sticky;top:0;z-index:6;background:var(--bg);padding:14px 0 0 20px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs button{border:0;background:none;padding:0;color:var(--muted)}
.crumbs button:hover{color:var(--accent)}
.crumbs .ic{width:12px;height:12px}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap}
.ph-title{display:flex;align-items:center;gap:10px;min-width:0}
.ph-title .pic{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex:none}
.ph-title h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:10px;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px 9px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tcnt{font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;background:var(--neutral-soft);color:var(--ink-2);line-height:17px}
.tcnt.crit{background:var(--crit-soft);color:var(--crit-ink)}
.content{padding:16px 0 28px 20px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s-3{grid-column:span 3}.s-4{grid-column:span 4}.s-5{grid-column:span 5}.s-6{grid-column:span 6}.s-7{grid-column:span 7}.s-8{grid-column:span 8}.s-9{grid-column:span 9}.s-12{grid-column:1/-1}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 0 14px;min-height:42px;border-bottom:1px solid var(--line)}
.ph-t{display:flex;align-items:center;gap:6px;min-width:0}
.ph-t h3{font-size:13.5px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-t .phs{font-size:12px;color:var(--muted);white-space:nowrap}
.ph-a{display:flex;align-items:center;gap:6px;flex:none}
.pb{padding:12px 14px 14px;flex:1;min-width:0}
.pb.flush{padding:0}
.src{display:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.expert .src{display:inline-block}
.tipi{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:var(--muted);border:0;background:none;padding:0;cursor:help;flex:none}
.tipi .ic{width:14px;height:14px}
.tipi:hover::after,.tipi:focus-visible::after{content:attr(data-tip);position:absolute;left:-8px;top:calc(100% + 6px);width:max-content;max-width:260px;white-space:normal;background:var(--ink);color:var(--panel);font-size:12px;font-weight:400;line-height:1.4;padding:7px 9px;border-radius:6px;z-index:40;text-align:left;box-shadow:var(--shadow)}

/* kpis */
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px 10px;display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left;color:inherit}
button.kpi:hover{border-color:var(--line-2);background:var(--panel-2)}
.kpi-l{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink-2);font-weight:500;min-height:20px}
.kpi-l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px;letter-spacing:0}
.kpi-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:100%;height:28px;margin-top:6px}
.spark path.l{fill:none;stroke-width:1.6}
.spark path.a{stroke:none;opacity:.12}
.kbar{height:6px;border-radius:3px;background:var(--track);margin-top:10px;overflow:hidden;margin-bottom:8px}
.kbar b{display:block;height:100%;border-radius:3px;background:var(--s1)}
.kbar.warn b{background:var(--warn)}.kbar.crit b{background:var(--crit)}

/* badges & buttons */
.b{display:inline-flex;align-items:center;gap:4px;padding:0 7px 0 5px;border-radius:4px;font-size:11.5px;font-weight:600;line-height:20px;white-space:nowrap;background:var(--neutral-soft);color:var(--ink-2)}
.b .ic{width:12px;height:12px;stroke-width:2.6}
.b.ok{background:var(--good-soft);color:var(--good-ink)}
.b.warn{background:var(--warn-soft);color:var(--warn-ink)}
.b.crit{background:var(--crit-soft);color:var(--crit-ink)}
.b.info{background:var(--info-soft);color:var(--info-ink)}
.b.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11.5px;line-height:19px;background:var(--neutral-soft);color:var(--ink-2);white-space:nowrap;margin:1px 2px 1px 0}
.tag.mono{font-family:var(--mono)}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:0 6px}
.btn.link:hover{text-decoration:underline}
.btn.danger{color:var(--crit-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.info{background:var(--s1)}

/* tables */
.tbl-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.sbox{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);min-width:180px;flex:0 1 260px}
.sbox input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:13px}
.sbox .ic{color:var(--muted);width:14px;height:14px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.selbar{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--panel-2);text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--ink)}
.t th .ar{display:inline-block;width:10px;margin-left:3px;color:var(--accent)}
.t td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--hover)}
.t tr.click{cursor:pointer}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t td.w{white-space:normal;min-width:260px}
.t .cb{width:34px;padding-right:0}
.t input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0;vertical-align:middle}
.c2l b{display:block;font-weight:600}
.c2l small{display:block;color:var(--muted);font-size:12px}
.xc{display:none}
.expert .xc{display:table-cell}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pager{display:flex;gap:4px}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.mb{display:inline-flex;align-items:center;gap:8px;min-width:130px}
.mb i{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:block;min-width:56px}
.mb i b{display:block;height:100%;background:var(--s1);border-radius:3px}
.mb.warn i b{background:var(--warn)}.mb.crit i b{background:var(--crit)}
.mb span{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.yes{color:var(--good-ink)}.no{color:var(--muted)}
.yes .ic,.no .ic{width:15px;height:15px;stroke-width:2.4}

/* kv, lists */
.kv{display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr);margin:0}
.kv dt,.kv dd{padding:7px 0;border-bottom:1px solid var(--line);margin:0;min-width:0}
.kv dt{color:var(--muted);padding-right:12px}
.kv dd{overflow-wrap:anywhere}
.kv > :nth-last-child(-n+2){border-bottom:0}
.slist{display:flex;flex-direction:column}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.sl:last-child{border-bottom:0}
button.sl:hover{background:var(--hover)}
.sl .lbl{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden}
.sl .lbl .ic{color:var(--muted)}
.sl .met{font-size:12.5px;color:var(--muted);white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) 70px;gap:10px;align-items:center;padding:5px 0}
.hb .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ helpers ============ */

const RANGES = {'1h':{n:60, step:1/60}, '24h':{n:96, step:.25}, '7d':{n:168, step:1}, '30d':{n:120, step:6}};

function gen(sp){
  const [seed, b, a, z, lo = 0, hi = 100, end] = sp, R = RANGES[S.range], r = rng(seed * 31 + R.n), out = [];
  let w = 0;
  for(let i = 0; i < R.n; i++){
    const t = tAt(i, R.n, R.step), hr = t.getHours() + t.getMinutes() / 60;
    w = w * .72 + (r() - .5) * z;
    out.push(Math.max(lo, Math.min(hi, b + a * Math.sin((hr - 9) / 24 * 2 * Math.PI) + w)));
  }
  if(end != null){ out[R.n - 1] = end; out[R.n - 2] = (out[R.n - 2] + end) / 2; }
  return out;
}
function tLab(i, n, tip){

  const wd = d.toLocaleDateString('en-GB', {weekday:'short'}), dm = d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});

}

/* ============ page status ============ */
function pageSt(id){
  switch(id){
    case 'overview': return issues().some(i => i.sev === 'crit') ? 'crit' : 'warn';
    case 'storage': return diskSt();
    case 'services': return S.btRestarted ? 'warn' : 'crit';
    case 'security': return S.secFixed ? 'ok' : 'warn';
    case 'packages': return S.secFixed ? 'info' : 'warn';
    case 'power': case 'backups': case 'logs': case 'containers': return 'warn';
    case 'system': return 'info';
    default: return 'ok';
  }
}

function openFix(id, preset){

function runFix(){

function applyFix(d){

    if(S.TS.pending) S.TS.pending.sel = {};
    d.result = {title:`${n} updates installed`, time, cells:[['Security updates pending', '4 → 0'], ['Health score', `${s0} → ${score()}`], ['Known CVEs', '3 → 0'], ['Reboot', 'Required']], note:'Restart when convenient to load the updated libraries.'};
    DEECURE_LOG.unshift({when:'Today ' + time, time, text:`Installed ${n} updates`, sub:'apt-get install --only-upgrade', target:'apt', undoNote:'Not reversible'});
  } else {
    S.battFixed = true; S.battTime = time;
    d.result = {title:'Low-battery action configured', time, cells:[['At 10%', 'Warning'], ['At 5%', 'Clean power-off']], note:'Reversible from Activity › DeeCure Actions or Backups › Restore Points.'};
    DEECURE_LOG.unshift({when:'Today ' + time, time, text:'Configured low-battery action', sub:'PercentageAction=5', target:'/etc/UPower/UPower.conf', undo:'batt'});
  }
}

/* ============ events ============ */
function toast(m){ $('#toast').innerHTML = `<div class="toast">${m}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').innerHTML = '', 3200); }
function refreshTable(id){ const el = document.querySelector(`[data-tbl="${id}"]`); if(el && REG[id]) el.innerHTML = tableHTML(REG[id]); }
function ask(key){
  const a = ANS[key];
  S.chat.push({u:a ? a.q : key}, {wait:true}); if(S.page === 'assistant') render(true);
  setTimeout(() => { S.chat = S.chat.filter(m => !m.wait); S.chat.push({a:a ? key : 'none'}); if(S.page === 'assistant') render(true); }, 700);
}
function act(a){
  const i = a.indexOf(':'), k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  if(k !== 'pop') S.pop = null;
  switch(k){
    case 'go': S.drawer = null; go(v); break;
    case 'toast': toast(v); renderOverlay(); break;
    case 'close': if(!(S.drawer && S.drawer.phase === 'run')) S.drawer = null; S.cmdk = null; renderOverlay(); break;
    case 'close-go': S.drawer = null; go(v); break;
    case 'range': S.range = v; render(true); break;
    case 'mode': S.expert = v === 'e'; render(true); break;
    case 'rail': S.rail = !S.rail; render(true); break;
    case 'navtoggle': $('#app').classList.toggle('navopen'); break;
    case 'pop': S.pop = S.pop === v ? null : v; renderOverlay(); break;
    case 'cmdk': S.cmdk = {q:'', i:0}; renderOverlay(); break;
    case 'refresh': render(true); toast('Refreshed · 21:34'); break;
    case 'export': toast('Export is disabled in the prototype.'); break;
    case 'fix': {
      if(v === 'storage' && cleanable() < .05){ toast('Nothing left to clean.'); break; }
      if(v === 'sec' && S.secFixed){ toast('Security updates are already installed.'); break; }
      if(v === 'batt' && S.battFixed){ toast('Low-battery action is already configured.'); break; }
      let preset = null;
      if(v === 'storage' && S.page === 'storage' && S.tab === 'cleanup' && S.TS.cleanup && Object.values(S.TS.cleanup.sel).some(Boolean)){ const avail = FIXES.storage.steps.filter(s => !S.cleaned[s.id]); preset = {}; Object.entries(S.TS.cleanup.sel).forEach(([ix, on]) => { if(on && avail[+ix]) preset[avail[+ix].id] = true; }); }
      openFix(v, preset); break; }
    case 'fx': {
      const d = S.drawer; if(!d) break;
      if(v === 'apply'){ const ch = chosenSteps(d); if(!ch.length) break; if(ch.some(s => s.admin)){ d.phase = 'auth'; renderOverlay(); } else runFix(); }
      else if(v === 'auth') runFix();
      else if(v === 'back'){ d.phase = 'preview'; renderOverlay(); }
      break; }
    case 'bt': S.drawer = {type:'bt'}; renderOverlay(); break;
    case 'btrestart': S.btRestarted = true; S.btTime = clockTick(); S.drawer = null; render(true); toast('bluetooth.service restarted · monitoring for new crashes.'); break;
    case 'askgo': S.drawer = null; go('assistant/chat'); ask(v); break;
    case 'ask': ask(v); break;
    case 'undo':
      if(v === 'cups'){ S.cupsUndone = true; toast('Undone · cups-browsed.service enabled and started.'); }
      if(v === 'batt'){ S.battFixed = false; const r = DEECURE_LOG.find(x => x.undo === 'batt' && !x.undone); if(r) r.undone = true; toast('Undone · UPower.conf restored from the restore point.'); }
      render(true); break;
    case 'track': S.tracked[v] = true; render(true); toast('Job wrapped · results are recorded from the next run.'); break;
    case 'diag': case 'net': {
      const st = k === 'diag' ? S.diag : S.net, n = k === 'diag' ? DIAG_STEPS.length : NET_STEPS.length;
      st.phase = 'run'; st.n = 0; render(true);
      const t = () => { if(st.phase !== 'run') return; st.n++; if(st.n >= n) st.phase = 'done'; if(S.page === 'diagnostics') render(true); if(st.phase === 'run') setTimeout(t, 450); };
      setTimeout(t, 450); break; }
  }
}
document.addEventListener('click', e => {
  const t = e.target;
  if(t.closest('input, select, .switch, label.rad, label.sbox')) return;
  const nav = t.closest('[data-nav]');
  if(nav){ const id = nav.dataset.nav; if(S.page === id && PAGES[id].tabs.length > 1 && !S.rail){ S.open[id] = !(S.open[id] ?? true); $('#nav').innerHTML = navHTML(); } else go(id); return; }
  const g = t.closest('[data-go]'); if(g){ S.cmdk = null; S.drawer = null; go(g.dataset.go); return; }
  const srt = t.closest('[data-tsort]'); if(srt){ const [id, ci] = srt.dataset.tsort.split('|'), st = S.TS[id]; if(st.sort === +ci) st.dir = -st.dir; else { st.sort = +ci; st.dir = 1; } refreshTable(id); return; }
  const fl = t.closest('[data-tfilter]'); if(fl){ const [id, o] = fl.dataset.tfilter.split('|'); S.TS[id].f = o; S.TS[id].pg = 0; refreshTable(id); return; }
  const pg = t.closest('[data-tpage]'); if(pg){ const [id, dlt] = pg.dataset.tpage.split('|'); S.TS[id].pg += +dlt; refreshTable(id); return; }
  const a = t.closest('[data-act]'); if(a && !a.disabled){ act(a.dataset.act); return; }
  const ins = t.closest('[data-tinsp]'); if(ins){ const [id, i] = ins.dataset.tinsp.split('|'); S.drawer = {type:'insp', tid:id, i:+i}; renderOverlay(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.tsearch){ const id = t.dataset.tsearch; S.TS[id].q = t.value; S.TS[id].pg = 0; const pos = t.selectionStart; refreshTable(id); const n = document.querySelector(`[data-tsearch="${id}"]`); if(n){ n.focus(); n.setSelectionRange(pos, pos); } }
  if(t.id === 'cmdkq'){ S.cmdk.q = t.value; S.cmdk.i = 0; renderOverlay(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.fx && S.drawer){ S.drawer.sel[t.dataset.fx] = t.checked; const ch = chosenSteps(S.drawer), b = $('#fxapply'), n = $('#fxnote'); if(b){ b.disabled = !ch.length; b.textContent = applyLabel(S.drawer, ch); } if(n) n.textContent = fxNote(ch); return; }
  if(t.dataset.tsel){ const [id, i] = t.dataset.tsel.split('|'); S.TS[id].sel[+i] = t.checked; refreshTable(id); return; }
  if(t.dataset.tselall){ const id = t.dataset.tselall; REG[id].rows.forEach((_, i) => S.TS[id].sel[i] = t.checked); refreshTable(id); return; }
  if(t.name === 'access'){ S.access = t.value; render(true); toast(t.value === 'full' ? 'Full access · admin helper authorized.' : 'Basic access · admin-only checks are locked.'); return; }
  if(t.id === 'set-expert'){ S.expert = t.checked; render(true); return; }
  if(t.id === 'set-range'){ S.range = t.value; render(true); return; }
  if(t.id === 'set-ai'){ S.ai = t.checked; toast(t.checked ? 'Assistant enabled.' : 'Assistant disabled.'); return; }
  if(t.id === 'set-cloud'){ S.aiCloud = t.checked; toast(t.checked ? 'Cloud fallback on · data redacted before sending.' : 'Cloud fallback off.'); return; }
  if(t.name === 'pp'){ toast('Power profile set to ' + t.closest('label').querySelector('b').textContent + '.'); return; }
  if(t.matches('.switch input, select')) toast('Saved.');
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'askf') return;
  e.preventDefault();
  const q = $('#askq').value.trim(), t = q.toLowerCase(); if(!q) return;
  const k = /restart|shut|power off|turned off/.test(t) ? 'restart' : /bluetooth|earbud/.test(t) ? 'bt' : /ssd|nvme|drive health/.test(t) ? 'ssd' : /disk|space|full|storage/.test(t) ? 'disk' : null;
  if(k) ask(k); else { S.chat.push({u:q}, {wait:true}); render(true); setTimeout(() => { S.chat = S.chat.filter(m => !m.wait); S.chat.push({a:'none'}); render(true); }, 700); }
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); act('cmdk'); return; }
  if(S.cmdk){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = S.cmdk.list.length; if(!n) return; S.cmdk.i = (S.cmdk.i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; renderOverlay(); const b = document.querySelector('.cmdk-l .act'); if(b) b.scrollIntoView({block:'nearest'}); return; }
    if(e.key === 'Enter'){ e.preventDefault(); const x = S.cmdk.list[S.cmdk.i]; if(x){ S.cmdk = null; go(x.go); } return; }
  }
  if(e.key === 'Escape'){ if(S.drawer && S.drawer.phase === 'run') return; S.drawer = null; S.cmdk = null; S.pop = null; $('#app').classList.remove('navopen'); renderOverlay(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { mountCharts(); if(S.pop) renderOverlay(); }, 120); });
document.addEventListener('click', e => { if($('#app').classList.contains('navopen') && !e.target.closest('.sidebar') && !e.target.closest('.menu-btn')) $('#app').classList.remove('navopen'); }, true);
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(mountCharts, 80); }).observe(document.getElementById('main'));

/* ============ boot ============ */
(() => { const h = (location.hash || '').slice(1).split('.'); if(PAGES[h[0]]){ S.page = h[0]; S.tab = (h[1] && PAGES[h[0]].tabs.some(t => t.id === h[1])) ? h[1] : PAGES[h[0]].tabs[0].id; } S.open[S.page] = true; render(); })();
</script>
