<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the helper's name. Anyone may call its interface; polkit then
     decides per action, and the helper checks every input. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.krisskad0.DeeCure.Helper"/>
    <allow send_destination="io.github.krisskad0.DeeCure.Helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.krisskad0.DeeCure.Helper"
           send_interface="io.github.krisskad0.DeeCure.Helper1"/>
    <allow send_destination="io.github.krisskad0.DeeCure.Helper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.krisskad0.DeeCure.Helper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
