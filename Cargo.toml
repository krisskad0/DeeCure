[workspace]
resolver = "3"
members = [
    "crates/deecure-core",
    "crates/deecure-agent",
    "crates/deecure-cli",
    "crates/deecure-helper",
    "crates/deecure-fix",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/krisskad0/DeeCure"
homepage = "https://github.com/krisskad0/DeeCure"
authors = ["DeeCure contributors"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
deecure-fix = { path = "crates/deecure-fix" }
deecure-core = { path = "crates/deecure-core" }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
listenfd = "1"
rusqlite = "0.40"
rustix = { version = "1", features = ["fs", "param", "process"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "process", "signal", "time", "sync"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
