[package]
name = "deecure-desktop"
description = "The DeeCure desktop app: a Tauri window around the React UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "deecure-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
deecure-core.workspace = true
deecure-fix.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[features]
# Serves the built UI from inside the binary. Release builds turn it on; `tauri dev` does not.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
