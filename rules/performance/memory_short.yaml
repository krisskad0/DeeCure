id: performance.memory_short
category: performance
name: "Memory is short"
title: "The computer is short of memory"
explain: >
  For {pressure.memory_stall_minutes} minutes, all apps had to wait for memory at least
  10% of the time, so the computer freezes for moments. Close apps you do not need, or
  see Processes › Top Consumers for what uses the most memory.
limits:
  - name: minutes
    label: "Minutes of memory stalls before warning"
    default: 5
    unit: minutes
    min: 1
    max: 60
severity:
  warning: "pressure.memory_stall_minutes >= limit.minutes"
learn_more: topics/performance/memory
