id: services.unit_failed
category: services
for_each: services
title: "{item.name} has stopped working"
explain: >
  The service "{item.description}" failed, so whatever it does is not
  running now. Restarting it often helps. If it keeps failing, its log
  shows why.
severity:
  # A service started by a timer is a scheduled job: jobs.job_failed reports it.
  warning: "item.active == 'failed' and not item.timer"
fixes:
  - action: services.restart
learn_more: topics/services/failed-service
