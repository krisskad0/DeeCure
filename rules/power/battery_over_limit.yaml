id: power.battery_over_limit
category: power
for_each: batteries
name: "Battery charges past its limit"
title: "Battery {item.name} charges past its {item.charge_stop}% limit"
explain: >
  Battery {item.name} is set to stop charging at {item.charge_stop}%, but it has kept
  charging above that for {item.over_limit_minutes} minutes. The laptop's firmware is not
  following the limit, so the battery wears faster. Check the charge limits and the charge
  mode in Power › Power Profile › Power controls (Expert view). A limit set in DeeCure is set
  again each time the charger is plugged in.
limits:
  - name: minutes
    label: "Minutes before warning"
    default: 10
    unit: minutes
    min: 2
    max: 120
severity:
  warning: "item.over_limit_minutes >= limit.minutes"
learn_more: topics/power/battery-health
