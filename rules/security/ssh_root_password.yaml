id: security.ssh_root_password
category: security
name: "SSH root login with a password"
title: "SSH lets root sign in with a password"
explain: >
  The SSH server accepts the root account with a password. Anyone on the network can
  keep guessing it, and one right guess gives full control of the computer. Accounts › SSH
  shows the server's real settings. The helper checks this once a day.
severity:
  warning: "security.ssh_root_password == 1"
learn_more: topics/security/ssh-root-login
