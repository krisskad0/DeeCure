id: hardware.fan_stopped
category: hardware
name: "Fan stopped while hot"
title: "A fan stopped while the processor is hot"
explain: >
  A fan reports 0 RPM while the processor is at {temp.cpu} °C, for
  {fan.stopped_hot_minutes} minutes. Fans that stop when the computer is cool are
  normal; a fan that stays off when it is hot may be broken or blocked.
limits:
  - name: minutes
    label: "Minutes before warning"
    default: 2
    unit: minutes
    min: 1
    max: 30
severity:
  warning: "fan.stopped_hot_minutes >= limit.minutes"
learn_more: topics/hardware/overheating
