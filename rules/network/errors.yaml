id: network.errors
category: network
for_each: interfaces
name: "Network errors"
title: "{item.name} has network errors"
explain: >
  {item.error_percent}% of the packets on {item.name} had errors in the last 10
  minutes. A bad cable or port, or a driver problem. Try another cable or port.
limits:
  - name: percent
    label: "Error share before warning"
    default: 1
    unit: "%"
    min: 0.1
    max: 50
severity:
  warning: "item.error_percent >= limit.percent"
learn_more: topics/network/network-quality
