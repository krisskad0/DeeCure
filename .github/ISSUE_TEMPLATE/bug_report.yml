name: Bug report
description: Something in SysDoc does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Storage › Cleanup
        2. Click Free up space
        3. ...
  - type: input
    id: version
    attributes:
      label: SysDoc version
      description: Output of `sysdoc --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Ubuntu version and desktop
      description: Output of `lsb_release -ds`, plus your desktop (GNOME, KDE, …)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install SysDoc?
      options:
        - APT repository / install script
        - Downloaded .deb
        - PPA
        - Built from source
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl --user -u sysdoc-agent -n 100`. Remove anything private.
      render: text
