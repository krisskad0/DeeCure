# Dependency updates, kept calm: once a month, small updates (minor and patch) grouped
# into one pull request per ecosystem, and each major version as its own pull request
# to review. Security fixes come right away regardless (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      web:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 3
