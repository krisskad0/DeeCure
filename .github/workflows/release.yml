# Builds and publishes a release when a version tag (v0.2.0, v0.2.0-rc.1) is pushed.
# Nothing here runs on normal pushes.
#
# Two jobs, least privilege:
# - build: read-only. Builds and tests the packages, makes checksums and an SBOM (the
#   list of every component inside), and hands them to the next job.
# - publish: the only job that can write. It signs build provenance for every file
#   (Sigstore, so anyone can check a file came from this workflow and this commit),
#   creates the GitHub Release, and, when the APT_SIGNING_KEY secret exists, updates
#   the APT repository on GitHub Pages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

      - name: Install tools
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential libsqlite3-dev libwebkit2gtk-4.1-dev debhelper devscripts lintian pkgconf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build the packages and check them with lintian
        run: make deb

      - name: Install, use, and purge them
        run: sudo scripts/test-deb.sh --throwaway target/deb/deecure_*.deb target/deb/deecure-desktop_*.deb

      - name: Test the admin helper with real D-Bus and polkit
        run: docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 sh -c '/src/scripts/test-helper.sh --throwaway /src/target/deb/deecure_*.deb'

      - name: Release files with GitHub-safe names, and checksums
        # GitHub renames uploaded files with "~" (as in 0.1.0~alpha.1), so the names in
        # SHA256SUMS would not match what people download. The package version lives
        # inside the .deb, so the file name can change safely.
        run: |
          mkdir -p dist
          for f in target/deb/deecure_*.deb target/deb/deecure-desktop_*.deb; do
            cp "$f" "dist/$(basename "$f" | tr '~' '.')"
          done
          cp packaging/install.sh dist/
          cd dist && sha256sum ./*.deb ./install.sh | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS

      - name: SBOM (every Rust and npm component, with versions and licenses)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/deecure-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # create the release, push the APT repository
      id-token: write      # sign provenance with Sigstore (no long-lived key)
      attestations: write  # store the signed provenance on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Sign build provenance for every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/install.sh
            dist/SHA256SUMS

      - name: Sign the SBOM for the packages
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.deb
          sbom-path: dist/deecure-sbom.spdx.json

      - name: GitHub Release (pre-releases published, stable drafted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-releases (v0.1.0-alpha.1, -beta.2, -rc.1) are published at once, so the
          # one-command installer can find them. A stable release stays a draft until
          # someone reads it and presses Publish.
          mode="--draft"
          case "$GITHUB_REF_NAME" in *-*) mode="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $mode --title "DeeCure ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for what changed. Check a file: gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/deecure_*.deb dist/deecure-desktop_*.deb dist/SHA256SUMS dist/install.sh dist/deecure-sbom.spdx.json

      - name: Publish to the APT repository (GitHub Pages)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        if: env.APT_SIGNING_KEY != ''
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends reprepro gnupg
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          component=main
          case "$GITHUB_REF_NAME" in *-*) component=beta ;; esac
          git fetch origin gh-pages || true
          git worktree add site origin/gh-pages 2>/dev/null || { git worktree add --orphan -b gh-pages site; }
          scripts/build-apt-repo.sh site noble "$component" dist/deecure_*.deb dist/deecure-desktop_*.deb
          cd site
          git add -A
          git -c user.name="DeeCure release" -c user.email="krisskad0@users.noreply.github.com" commit -m "APT repository: $GITHUB_REF_NAME ($component)"
          git push origin HEAD:gh-pages
