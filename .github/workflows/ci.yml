name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_OPTIONS: -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120

jobs:
  # Docs-only changes skip the heavy jobs below. A skipped job counts as passed for the
  # required checks, so such pull requests can still merge. Anything unclear runs all.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # docs/03-ui-design feeds the generated UI code, so it counts as code.
          docs_only='^(docs/(0[124-8]|archive)[^/]*/|docs/README\.md$|[^/]+\.md$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$|\.github/labels\.yml$|\.github/rulesets/|LICENSE$)'
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "No base to compare with: run everything."; exit 0
          fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          echo "$changed"
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE "$docs_only"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Only docs changed: the heavy jobs are skipped."
          fi

  rust:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries (SQLite, and WebKitGTK for the desktop app)
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            libsqlite3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  web:
    name: Web UI (test, type-check, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Generated UI code matches the spec
        run: python3 ../scripts/gen-ui.py --check

      - name: Install packages
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  performance:
    name: Performance budget
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          dpkg -s libsqlite3-dev >/dev/null 2>&1 || {
            sudo apt-get $APT_OPTIONS update
            sudo apt-get $APT_OPTIONS install -y --no-install-recommends libsqlite3-dev
          }

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the agent against the budget
        run: make perf

      - name: Check that 2 years of history stay under 200 MB
        run: make db-size

  package:
    name: Build and test the .deb
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential libsqlite3-dev libwebkit2gtk-4.1-dev debhelper devscripts lintian pkgconf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the package and check it with lintian
        run: make deb

      - name: Install, use, and purge it
        run: sudo scripts/test-deb.sh --throwaway target/deb/deecure_*.deb target/deb/deecure-desktop_*.deb

      - name: Test the admin helper with real D-Bus and polkit (in a container)
        run: docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 sh -c '/src/scripts/test-helper.sh --throwaway /src/target/deb/deecure_*.deb'

      # Test builds of main, for people who want to try the newest code; a week is enough.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: deecure-deb
          path: target/deb/*.deb
          if-no-files-found: error
          retention-days: 7
