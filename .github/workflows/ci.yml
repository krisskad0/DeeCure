name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_OPTIONS: -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120

jobs:
  rust:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          dpkg -s libsqlite3-dev >/dev/null 2>&1 || {
            sudo apt-get $APT_OPTIONS update
            sudo apt-get $APT_OPTIONS install -y --no-install-recommends libsqlite3-dev
          }

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  package:
    name: Build and test the .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            libsqlite3-dev debhelper devscripts lintian pkgconf

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build the package and check it with lintian
        run: make deb

      - name: Install, use, and purge it
        run: sudo scripts/test-deb.sh --throwaway target/deb/deecure_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deecure-deb
          path: target/deb/*.deb
          if-no-files-found: error
