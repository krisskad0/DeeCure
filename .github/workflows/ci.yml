name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_OPTIONS: -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120

jobs:
  rust:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (SQLite, and WebKitGTK for the desktop app)
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            libsqlite3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  web:
    name: Web UI (test, type-check, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Generated UI code matches the spec
        run: python3 ../scripts/gen-ui.py --check

      - name: Install packages
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  performance:
    name: Performance budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          dpkg -s libsqlite3-dev >/dev/null 2>&1 || {
            sudo apt-get $APT_OPTIONS update
            sudo apt-get $APT_OPTIONS install -y --no-install-recommends libsqlite3-dev
          }

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check the agent against the budget
        run: make perf

      - name: Check that 2 years of history stay under 200 MB
        run: make db-size

  package:
    name: Build and test the .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends \
            build-essential libsqlite3-dev libwebkit2gtk-4.1-dev debhelper devscripts lintian pkgconf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build the package and check it with lintian
        run: make deb

      - name: Install, use, and purge it
        run: sudo scripts/test-deb.sh --throwaway target/deb/deecure_*.deb target/deb/deecure-desktop_*.deb

      - name: Test the admin helper with real D-Bus and polkit (in a container)
        run: docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 sh -c '/src/scripts/test-helper.sh --throwaway /src/target/deb/deecure_*.deb'

      - uses: actions/upload-artifact@v4
        with:
          name: deecure-deb
          path: target/deb/*.deb
          if-no-files-found: error
